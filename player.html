<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Просмотр плейлиста</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; }
    .topbar {
      padding: 10px 16px;
      background: #222;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .topbar a {
      color: #4ea1ff;
      text-decoration: none;
      font-size: 16px;
    }
    .topbar a:hover { text-decoration: underline; }
    .player-wrap {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
    }
    .player-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="index.html">← Вернуться на главную</a>
  </div>

  <div class="player-wrap">
    <iframe id="ytPlayer" allowfullscreen
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
    </iframe>
  </div>

  <script>
    // 1. Читаем ID плейлиста из адресной строки
    const params = new URLSearchParams(window.location.search);
    const listId = params.get('list');

    // 2. Если параметр не передан — показываем сообщение
    if (!listId) {
      document.querySelector('.player-wrap').innerHTML =
        '<p style="color:#fff;padding:20px;">Плейлист не указан.</p>';
    } else {
      // 3. Формируем embed-ссылку и подставляем в iframe
      const src = 'https://www.youtube.com/embed/videoseries?list=' + encodeURIComponent(listId);
      document.getElementById('ytPlayer').src = src;
    }
  </script>

</body>
</html>
